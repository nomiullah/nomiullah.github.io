<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Noman Ullah Jannat</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="That page is not on Noman Ullah Jannat's portfolio. Head back to the homepage." />
  <link rel="canonical" href="https://nomiullah.github.io/" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style/style.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('noman-theme');
        document.documentElement.classList.add(saved === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <main id="main" class="section">
    <div class="wrap">
      <p class="eyebrow">404</p>
      <h1 class="display">This page is not here.</h1>
      <div class="rule"></div>
      <p>The link may be old. The portfolio, work, and contact form are all on the home page.</p>
      <p><a class="btn btn-accent" href="./">Back to home</a></p>
    </div>
  </main>
</body>
</html>
